<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FPV — Ajustes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&amp;family=Doto:wght@700;800;900&amp;family=Martian+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0D12}
.nav:hover{background:rgba(255,255,255,0.06) !important}
.ib:hover{background:rgba(255,255,255,0.1) !important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #F2F2F6;outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(90deg,#8B7CFF 0 16%,rgba(255,255,255,0.1) 16% 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#F2F2F6;box-shadow:0 0 0 4px rgba(139,124,255,0.3)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:rgba(255,255,255,0.1)}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:#8B7CFF}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#F2F2F6}
</style>
</helmet>
<div style="position: relative; width: 900px; height: 416px; overflow: hidden; background: #0D0D12; color: #F2F2F6; font-family: 'Urbanist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex">

<div aria-hidden="true" style="position: absolute; left: -20%; bottom: -60%; width: 70%; height: 100%; filter: blur(80px); opacity: 0.22; background: radial-gradient(50% 50% at 50% 50%, #8B7CFF, transparent 70%)"></div>

<nav aria-label="Secciones de ajustes" style="position: relative; width: 210px; flex: none; box-sizing: border-box; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(255,255,255,0.08)">
<a href="Main.dc.html" class="ib" style="height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; margin-bottom: 10px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #F2F2F6; text-decoration: none; font-size: 14px; font-weight: 600; align-self: flex-start"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path></svg>Volver a volar</a>
<button class="nav" aria-current="page" style="height: 44px; border: 0; border-radius: 14px; padding: 0 14px; text-align: left; background: rgba(255,255,255,0.08); color: #F2F2F6; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Sticks</button>
<button class="nav" style="height: 44px; border: 0; border-radius: 14px; padding: 0 14px; text-align: left; background: transparent; color: #C9C9D4; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Botones</button>
<button class="nav" style="height: 44px; border: 0; border-radius: 14px; padding: 0 14px; text-align: left; background: transparent; color: #C9C9D4; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Conexión</button>
<button class="nav" style="height: 44px; border: 0; border-radius: 14px; padding: 0 14px; text-align: left; background: transparent; color: #C9C9D4; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Avanzado</button>
<span style="flex: 1"></span>
<span style="padding: 0 14px; font-family: 'Martian Mono', ui-monospace, monospace; font-size: 10px; color: #9C9CAD">v0.4.0-beta.1</span>
</nav>

<main style="position: relative; flex: 1; min-width: 0; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Sticks</h1>
<span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; color: #9C9CAD">MODE 2</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="padding: 16px 18px; border-radius: 22px; background: rgba(30,30,40,0.62); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="dz" style="font-size: 15px; font-weight: 600">Zona muerta</label>
<span><span style="font-family: 'Doto', ui-monospace, monospace; font-weight: 900; font-size: 24px; line-height: 1">4</span><span style="font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; color: #9C9CAD; margin-left: 2px">%</span></span>
</div>
<input id="dz" type="range" min="0" max="25" value="4">
<span style="font-size: 13px; color: #9C9CAD">Ignora movimientos mínimos cerca del centro.</span>
</div>

<div style="padding: 16px 18px; border-radius: 22px; background: rgba(30,30,40,0.62); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Invertir ejes</span>
<div role="group" aria-label="Invertir ejes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<button aria-pressed="false" style="height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #C9C9D4; font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; cursor: pointer">YAW</button>
<button aria-pressed="false" style="height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #C9C9D4; font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; cursor: pointer">THR</button>
<button aria-pressed="false" style="height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #C9C9D4; font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; cursor: pointer">ROLL</button>
<button aria-pressed="true" style="height: 44px; border-radius: 14px; background: rgba(139,124,255,0.2); border: 1px solid rgba(139,124,255,0.7); color: #F2F2F6; font-family: 'Martian Mono', ui-monospace, monospace; font-size: 11px; cursor: pointer">PITCH</button>
</div>
<span style="font-size: 13px; color: #9C9CAD">Toca un eje para invertirlo.</span>
</div>

<div style="padding: 16px 18px; border-radius: 22px; background: rgba(30,30,40,0.62); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 14px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">Calibración</span>
<span style="font-size: 13px; color: #9C9CAD">Última: hoy · centros y extremos OK</span>
</div>
<button class="ib" style="height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #F2F2F6; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Calibrar</button>
</div>

<div style="padding: 16px 18px; border-radius: 22px; background: rgba(30,30,40,0.62); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 14px">
<label for="dbg" style="flex: 1; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
<span style="font-size: 15px; font-weight: 600">Valores en vivo</span>
<span style="font-size: 13px; color: #9C9CAD">Muestra los ejes bajo cada stick.</span>
</label>
<button id="dbg" role="switch" aria-checked="true" aria-label="Valores en vivo" style="position: relative; width: 52px; height: 32px; flex: none; border: 0; border-radius: 999px; background: #8B7CFF; cursor: pointer"><span style="position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 50%; background: #F2F2F6"></span></button>
</div>
</div>

<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C9CAD" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>
<span style="font-size: 13px; color: #C9C9D4">Yaw, Roll y Pitch vuelven al centro al soltar. Throttle mantiene su última posición.</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":416}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

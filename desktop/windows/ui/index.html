<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'">
<title>FPV Phone Controller</title>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <section class="chips" id="chips" aria-label="Status"></section>
  <div class="status-row" id="status-row" hidden></div>
  <section class="card" id="card" aria-live="polite"></section>
  <section class="advanced" id="advanced" aria-label="Advanced" hidden></section>
  <footer>
    <button class="pill ghost" type="button" id="advanced-toggle" aria-expanded="false" aria-controls="advanced">Advanced
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="pill ghost" type="button" data-cmd="open-logs">Logs</button>
    <span class="version" id="version"></span>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
